name: Scrape Finn.no Car Listings

on:
  push:
    paths:
      - ".github/workflows/scrape.yml"
      - "scrape_finn.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scrape_finn.py --output listings.json

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            raw_page.html
            raw_next_data.json
          retention-days: 7

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listings.json 2>/dev/null || true
          git add raw_page.html raw_next_data.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update scraped car listings from finn.no [bot]"
          git push
